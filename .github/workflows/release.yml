name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  state:
    name: Resolve release state
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.release.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Read version
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - id: release
        name: Check whether this version is already released
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "$TAG already exists; no new release is needed."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Verify ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: state
    if: needs.state.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -B scripts/public_ci.py
      - run: python -B scripts/build_release.py --version "${{ needs.state.outputs.version }}" --output-dir dist

  publish:
    name: Publish GitHub prerelease
    needs: [state, verify]
    if: needs.state.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build release artifact
        run: python -B scripts/build_release.py --version "${{ needs.state.outputs.version }}" --output-dir dist
      - name: Create version tag and GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.state.outputs.tag }}
        shell: bash
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PDC $TAG" \
            --notes-file RELEASE_NOTES.md \
            --prerelease \
            dist/*
